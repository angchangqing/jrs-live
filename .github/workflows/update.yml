name: 更新JRS直播源

on:
  schedule:
    # 每小时整点运行
    - cron: '0 * * * *'
  workflow_dispatch: # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run update
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python jrs_auto.py
